[project]
name = "r4-jpn-research"
mode = "fake"
runs_dir = "runs"
database = "runs/experiments.sqlite3"

[target]
serial = "unknown-until-verified"
executable_sha256 = ""
disc_path = ""
bios_path = ""
save_state = ""
# Private real-mode values belong only in ignored config/project.toml. The
# capture-manual-state command can discover and register them automatically.

[emulator]
executable = ""
lua_bootstrap = "lua/bootstrap.lua"
ipc_directory = "runs/ipc"
request_timeout_seconds = 5.0
# Optional, operator-confirmed PS1 scratchpad address for the separately gated
# capability write test. Leave unset until its safety is established.
# scratch_address = "0x1F8003FC"

[experiment]
vblanks = 120
scenario = "fake-straight"
# A verified manual capture changes the ignored local scenario to race-straight.

[tools]
# Local official Ghidra support/analyzeHeadless path; keep private paths in the
# ignored config/project.toml only.
ghidra_headless = ""
# RecompOne source checkout, built recompone.dll, or executable. Keep real
# private paths in ignored config/project.toml only.
recompone = ""
